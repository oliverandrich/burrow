[tools]
go = "1.26"
"go:github.com/mfridman/tparse" = "latest"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:github.com/google/go-licenses" = "latest"
"go:github.com/quantumcycle/go-ignore-cov" = "latest"
"github:tailwindlabs/tailwindcss" = "4"
"pipx:pre-commit" = "latest"
"pipx:zensical" = "latest"

[tasks.test]
description = "Run all tests"
run = 'go test -race -json "$@" ./... | tparse'

[tasks.lint]
description = "Run linter"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Format all Go files"
run = [
    "gofmt -w .",
    "goimports -w .",
]

[tasks.tidy]
description = "Tidy module dependencies"
run = "go mod tidy"

[tasks.vuln]
description = "Run vulnerability check"
run = "govulncheck ./..."

[tasks.beans]
description = "List active beans (excludes completed and scrapped)"
run = "beans list --no-status completed --no-status scrapped"

[tasks.licenses]
description = "Regenerate THIRD_PARTY_LICENSES.md from go-licenses"
run = "./scripts/generate-licenses.sh"

[tasks."example-hello"]
description = "Run the hello world example"
run = 'go run ./example/hello "$@"'

[tasks."example-notes"]
description = "Run the notes example application"
run = 'go run ./example/notes/cmd/server "$@"'

[tasks."example-themes"]
description = "Run the µCSS theme preview (every accent variant in one page)"
run = 'go run ./example/themes "$@"'

# --- Vendored asset updates ---
# Each `update-*` recipe pulls a fixed upstream version into contrib/<app>/static.
# Override the version with `mise run update-X version=Y` (note the named arg
# style, not positional). Examples:
#   mise run update-htmx                  # pinned default
#   mise run update-htmx version=2.1.0    # override
# The contribs that delete in v0.20 (bsicons, bootstrap, alpine, mucss) take their
# update recipes with them; only `update-htmx` survives long-term.

[tasks."update-htmx"]
description = "Update htmx vendored JS (override with version=X)"
run = '''
set -euo pipefail
v="${version:-2.0.8}"
echo "Downloading htmx v$v..."
curl -sL "https://unpkg.com/htmx.org@$v/dist/htmx.min.js" -o contrib/htmx/static/htmx.min.js
echo "Done — htmx v$v updated"
'''

[tasks."update-mucss"]
description = "Update µCSS vendored CSS (default + 20 named accents) (override with version=X)"
run = '''
set -euo pipefail
v="${version:-1.4.8}"
base="https://cdn.jsdelivr.net/npm/@digicreon/mucss@$v/dist"
out="contrib/mucss/static"
colors=(amber azure blue cyan fuchsia green grey indigo jade lime orange pink pumpkin purple red sand slate violet yellow zinc)
echo "Downloading µCSS v$v..."
curl -fsSL "$base/mu.css" -o "$out/mu.css"
for color in "${colors[@]}"; do
    curl -fsSL "$base/mu.${color}.css" -o "$out/mu.${color}.css"
done
echo "Done — µCSS v$v updated (${#colors[@]} accents + default)"
'''

[tasks."update-bootstrap"]
description = "Update Bootstrap CSS/JS vendored assets (override with version=X)"
run = '''
set -euo pipefail
v="${version:-5.3.8}"
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
echo "Downloading Bootstrap v$v..."
curl -sL "https://github.com/twbs/bootstrap/releases/download/v$v/bootstrap-$v-dist.zip" -o "$tmp/bootstrap.zip"
unzip -q -o "$tmp/bootstrap.zip" -d "$tmp/extract"
cp "$tmp/extract/bootstrap-$v-dist/css/bootstrap.min.css" contrib/bootstrap/static/
cp "$tmp/extract/bootstrap-$v-dist/js/bootstrap.bundle.min.js" contrib/bootstrap/static/
echo "Done — Bootstrap v$v updated"
'''

[tasks."update-icons"]
description = "Update Bootstrap Icons SVG components (override with version=X)"
run = '''
set -euo pipefail
v="${version:-1.13.1}"
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
echo "Downloading Bootstrap Icons v$v..."
curl -sL "https://github.com/twbs/icons/releases/download/v$v/bootstrap-icons-$v.zip" -o "$tmp/icons.zip"
unzip -q -o "$tmp/icons.zip" -d "$tmp/extract"
echo "Generating icon functions..."
go run ./contrib/bsicons/internal/generate -icons-dir "$tmp/extract/bootstrap-icons-$v" > contrib/bsicons/icons_generated.go
count=$(grep -c '^func ' contrib/bsicons/icons_generated.go)
echo "Done — $count icons generated from Bootstrap Icons v$v"
'''

[tasks."sass-setup"]
description = "Install Bootstrap Sass source (needed for theme compilation)"
run = "cd contrib/bootstrap && npm install --save-dev bootstrap@5.3.8 --silent"

[tasks.sass]
description = "Compile all Bootstrap Sass themes"
depends = ["sass-setup"]
run = [
    "sass contrib/bootstrap/scss/theme-blue.scss contrib/bootstrap/static/theme-blue.min.css --style=compressed --no-source-map --quiet-deps --quiet",
    "sass contrib/bootstrap/scss/theme-purple.scss contrib/bootstrap/static/theme-purple.min.css --style=compressed --no-source-map --quiet-deps --quiet",
    "sass contrib/bootstrap/scss/theme-gray.scss contrib/bootstrap/static/theme-gray.min.css --style=compressed --no-source-map --quiet-deps --quiet",
]
