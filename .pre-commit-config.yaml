repos:
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run ./...
        language: system
        files: '\.go$'
        pass_filenames: false

      - id: govulncheck
        name: govulncheck
        entry: govulncheck ./...
        language: system
        files: '\.go$|^go\.(mod|sum)$'
        pass_filenames: false

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        files: '\.go$'
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: '^go\.(mod|sum)$'
        pass_filenames: false

      - id: licenses
        name: Regenerate THIRD_PARTY_LICENSES.md
        entry: mise run licenses
        language: system
        files: 'go\.(mod|sum)$'
        pass_filenames: false

      - id: no-compiled-binaries
        name: Reject compiled binaries (Mach-O/ELF/PE)
        entry: mise run no-compiled-binaries
        language: system
        types: [binary]

  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-golang
        types_or: [html]
