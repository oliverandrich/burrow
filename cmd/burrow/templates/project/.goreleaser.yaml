# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# SPDX-License-Identifier: MIT

version: 2
project_name: __ProjectName__

builds:
  - id: __ProjectName__
    main: ./cmd/__ProjectName__
    binary: __ProjectName__
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
      - goos: darwin
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
  groups:
    - title: Features
      regexp: "^feat"
    - title: Bug Fixes
      regexp: "^fix"
    - title: Others
      order: 999

dockers_v2:
  - id: __ProjectName__
    ids:
      - __ProjectName__
    dockerfile: Dockerfile
    images:
      - ghcr.io/__GitUser__/__ProjectName__
    tags:
      - "v{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "__ProjectDescription__"
      org.opencontainers.image.url: "https://github.com/__GitUser__/__ProjectName__"
      org.opencontainers.image.source: "https://github.com/__GitUser__/__ProjectName__"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

release:
  prerelease: auto
