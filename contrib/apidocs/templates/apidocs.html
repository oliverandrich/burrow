{{ define "apidocs/index" }}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="app" data-spec-url="{{ .SpecURL }}"></div>
    <script src="{{ staticURL "apidocs/scalar.standalone.js" }}"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: document.getElementById('app').dataset.specUrl,
        withDefaultFonts: false,
      })
    </script>
  </body>
</html>
{{ end }}
