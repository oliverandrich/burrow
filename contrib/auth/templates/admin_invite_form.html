{{ define "auth/admin_invite_form" -}}
<article class="rounded-lg border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-gray-900">
    <header class="mb-3">
        <strong>{{ t "Create Invite" }}</strong>
    </header>
    <form hx-post="/admin/invites" hx-target="body" class="space-y-3">
        <input type="hidden" name="gorilla.csrf.Token" value="{{ csrfToken }}">
        <label class="block">
            <span class="mb-1 block text-sm font-medium">{{ t "Label" }}</span>
            <input type="text" name="label" placeholder="{{ t "admin-invites-label-placeholder" }}"
                class="w-full rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500 dark:border-gray-700 dark:bg-gray-900">
        </label>
        {{- if .UseEmail }}
        <label class="block">
            <span class="mb-1 block text-sm font-medium">{{ t "Email" }}</span>
            <input type="email" name="email" placeholder="{{ t "admin-invites-email-placeholder" }}" required
                class="w-full rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500 dark:border-gray-700 dark:bg-gray-900">
        </label>
        {{- end }}
        <footer class="flex justify-end gap-2 pt-1">
            <button type="button"
                class="rounded-md border border-gray-300 px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800"
                onclick="this.closest('#invite-form').innerHTML=''">
                {{ t "Cancel" }}
            </button>
            <button type="submit"
                class="inline-flex items-center gap-1.5 rounded-md bg-emerald-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-emerald-700">
                {{ template "auth/icon_plus_lg" . }} {{ t "Create Invite" }}
            </button>
        </footer>
    </form>
</article>
{{- end }}
