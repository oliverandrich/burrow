{{ define "auth/admin_invite_form" -}}
<article>
    <header>
        <strong>{{ t "admin-invites-create-title" }}</strong>
    </header>
    <form hx-post="/admin/invites" hx-target="body">
        <input type="hidden" name="gorilla.csrf.Token" value="{{ csrfToken }}">
        <label>
            {{ t "admin-invites-label" }}
            <input type="text" name="label" placeholder="{{ t "admin-invites-label-placeholder" }}">
        </label>
        {{- if .UseEmail }}
        <label>
            {{ t "admin-invites-email-label" }}
            <input type="email" name="email" placeholder="{{ t "admin-invites-email-placeholder" }}" required>
        </label>
        {{- end }}
        <footer class="admin-row-actions">
            <button type="submit" class="btn btn-primary">
                {{ iconPlus }} {{ t "admin-invites-create-button" }}
            </button>
            <button type="button" class="btn btn-outline btn-secondary"
                onclick="this.closest('#invite-form').innerHTML=''">
                {{ t "admin-invites-cancel" }}
            </button>
        </footer>
    </form>
</article>
{{- end }}
