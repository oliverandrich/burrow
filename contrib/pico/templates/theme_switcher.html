{{ define "pico/theme_switcher" -}}
<details class="dropdown" id="pico-theme">
    <summary aria-label="Toggle theme">
        <span class="theme-icon" data-theme-icon="light">&#9728;</span>
        <span class="theme-icon" data-theme-icon="dark" hidden>&#9790;</span>
        <span class="theme-icon" data-theme-icon="auto" hidden>&#9680;</span>
    </summary>
    <ul>
        <li><button type="button" data-theme-value="light">&#9728; Light</button></li>
        <li><button type="button" data-theme-value="dark">&#9790; Dark</button></li>
        <li><button type="button" data-theme-value="auto">&#9680; Auto</button></li>
    </ul>
</details>
<script>
    (function(){
        var root=document.documentElement;
        var mq=window.matchMedia("(prefers-color-scheme: dark)");
        var container=document.getElementById("pico-theme");
        var icons=container.querySelectorAll(".theme-icon");
        var items=container.querySelectorAll("[data-theme-value]");

        function resolve(s){return s==="auto"?(mq.matches?"dark":"light"):s}

        function apply(s){
            localStorage.setItem("theme",s);
            root.setAttribute("data-theme",resolve(s));
            icons.forEach(function(el){el.hidden=el.getAttribute("data-theme-icon")!==s});
            container.removeAttribute("open");
        }

        apply(localStorage.getItem("theme")||"auto");

        items.forEach(function(btn){
            btn.addEventListener("click",function(){apply(btn.getAttribute("data-theme-value"))})
        });

        mq.addEventListener("change",function(){
            if((localStorage.getItem("theme")||"auto")==="auto"){root.setAttribute("data-theme",resolve("auto"))}
        });
    })()
</script>
{{- end }}
