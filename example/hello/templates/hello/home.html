{{ define "hello/home" -}}
<section class="hero">
    <hgroup>
        <h1>{{ t "hello-title" }}</h1>
        <p>{{ t "hello-subtitle" }}</p>
    </hgroup>
    <p>
        <button id="demo-dialog-open" class="btn btn-primary">Open dialog</button>
    </p>
</section>

<dialog id="demo-dialog">
    <article>
        <header>
            <button aria-label="Close" rel="prev"></button>
            <strong>Native &lt;dialog&gt;</strong>
        </header>
        <p>This dialog is styled by µCSS without any JavaScript framework.</p>
    </article>
</dialog>

<script>
    document.getElementById("demo-dialog-open").addEventListener("click", function(){
        document.getElementById("demo-dialog").showModal();
    });
</script>
{{- end }}
