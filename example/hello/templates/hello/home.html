{{ define "hello/home" -}}
<section class="space-y-6">
    <div>
        <h1 class="text-3xl font-bold tracking-tight">{{ t "hello-title" }}</h1>
        <p class="mt-2 text-gray-600 dark:text-gray-400">{{ t "hello-subtitle" }}</p>
    </div>
    <p>
        <button id="demo-dialog-open" type="button"
                class="rounded-md bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900">
            Open dialog
        </button>
    </p>
</section>

<dialog id="demo-dialog"
        class="rounded-lg border border-gray-200 bg-white p-0 shadow-xl backdrop:bg-black/40 dark:border-gray-800 dark:bg-gray-900">
    <article class="w-80 max-w-[90vw] p-6">
        <header class="mb-4 flex items-center justify-between">
            <strong>Native &lt;dialog&gt;</strong>
            <button type="button" aria-label="Close" class="text-2xl text-gray-500 hover:text-gray-700 dark:hover:text-gray-300"
                    onclick="document.getElementById('demo-dialog').close()">
                &times;
            </button>
        </header>
        <p class="text-sm text-gray-700 dark:text-gray-300">This dialog uses the browser's native <code class="rounded bg-gray-100 px-1 dark:bg-gray-800">&lt;dialog&gt;</code> element styled with Tailwind utilities — no JavaScript framework.</p>
    </article>
</dialog>

<script>
    document.getElementById("demo-dialog-open").addEventListener("click", function(){
        document.getElementById("demo-dialog").showModal();
    });
</script>
{{- end }}
