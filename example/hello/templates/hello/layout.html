{{ define "hello/layout" -}}
<!doctype html>
<html lang="{{ lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }} — hello</title>
    <link rel="stylesheet" href="{{ staticURL "app.min.css" }}">
    {{ template "htmx/js" . }}
</head>
<body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100 antialiased">
    <main class="mx-auto max-w-2xl px-4 py-16">
        {{ .Content }}
    </main>
</body>
</html>
{{- end }}
