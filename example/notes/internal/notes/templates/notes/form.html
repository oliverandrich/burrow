{{ define "notes/form" -}}
<article>
    <header><strong>{{ t .TitleKey }}</strong></header>
    {{ if .NonFieldErrors -}}
    <div role="alert" data-level="error" class="form-errors">
        {{ range .NonFieldErrors -}}
        <p>{{ . }}</p>
        {{- end }}
    </div>
    {{- end }}
    <form method="post" action="{{ .Action }}"
        hx-post="{{ .Action }}"
        hx-target="#note-form"
        hx-swap="innerHTML">
        {{ csrfField }}
        {{ range .Fields -}}
        <label for="{{ .FormName }}">
            {{ t .Label }}{{ if .Required }} *{{ end }}
            {{ if eq .Type "textarea" -}}
            <textarea id="{{ .FormName }}" name="{{ .FormName }}" rows="3"{{ if .Errors }} aria-invalid="true"{{ end }}>{{ .Value }}</textarea>
            {{- else -}}
            <input type="{{ .Type }}" id="{{ .FormName }}" name="{{ .FormName }}" value="{{ .Value }}"{{ if .Required }} required{{ end }}{{ if .Errors }} aria-invalid="true"{{ end }}>
            {{- end }}
        </label>
        {{ range .Errors -}}
        <small class="field-error">{{ . }}</small>
        {{- end }}
        {{- end }}
        <div class="form-actions">
            <button type="submit">{{ t "notes-save-button" }}</button>
            <button type="button" class="secondary outline"
                onclick="document.getElementById('note-form').innerHTML=''">
                {{ t "notes-cancel-button" }}
            </button>
        </div>
    </form>
</article>
<style>
.form-actions { display: flex; gap: .5rem; flex-wrap: wrap }
.form-actions button { width: auto }
.field-error { color: var(--pico-del-color); display: block; margin-top: -.5rem; margin-bottom: .75rem }
</style>
{{- end }}
