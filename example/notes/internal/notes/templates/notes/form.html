{{ define "notes/form" -}}
<article>
    <header>
        <button aria-label="Close" rel="prev"></button>
        <strong>{{ t .TitleKey }}</strong>
    </header>
    {{ if .NonFieldErrors -}}
    <div class="alert alert-error" role="alert">
        {{ range .NonFieldErrors -}}
        <p>{{ . }}</p>
        {{- end }}
    </div>
    {{- end }}
    <form method="post" action="{{ .Action }}"
        hx-post="{{ .Action }}"
        hx-target="#modal-body"
        hx-swap="innerHTML">
        {{ csrfField }}
        {{ range .Fields -}}
        <label for="{{ .FormName }}">
            {{ t .Label }}{{ if .Required }} *{{ end }}
            {{ if eq .Type "textarea" -}}
            <textarea id="{{ .FormName }}" name="{{ .FormName }}" rows="3"{{ if .Errors }} aria-invalid="true"{{ end }}>{{ .Value }}</textarea>
            {{- else -}}
            <input type="{{ .Type }}" id="{{ .FormName }}" name="{{ .FormName }}" value="{{ .Value }}"{{ if .Required }} required{{ end }}{{ if .Errors }} aria-invalid="true"{{ end }}>
            {{- end }}
        </label>
        {{ range .Errors -}}
        <small class="field-error">{{ . }}</small>
        {{- end }}
        {{- end }}
        <footer class="form-actions">
            <button type="submit">{{ t "notes-save-button" }}</button>
            <button type="button" class="secondary outline" rel="prev">
                {{ t "notes-cancel-button" }}
            </button>
        </footer>
    </form>
</article>
<style>
.form-actions { display: flex; gap: .5rem; flex-wrap: wrap }
.form-actions button { width: auto }
.field-error { color: var(--mu-del-color); display: block; margin-top: -.5rem; margin-bottom: .75rem }
</style>
{{- end }}
