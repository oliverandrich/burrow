{{ define "polls/results" -}}
<header>
    <h1>Results: {{ .Question.Text }}</h1>
</header>

<div class="grid">
    <div>
        <canvas id="results-chart" height="300"></canvas>
    </div>
    <div>
        <ul class="poll-results">
            {{ range .Question.Choices -}}
            <li>
                <span>{{ .Text }}</span>
                <span class="badge badge-primary">{{ .Votes }} vote{{ if ne .Votes 1 }}s{{ end }}</span>
            </li>
            {{ end -}}
        </ul>
    </div>
</div>

<div role="group">
    <a href="/polls/{{ .Question.ID }}" role="button" class="btn btn-primary">Vote again</a>
    <a href="/polls" role="button" class="btn btn-outline btn-secondary">&laquo; Back to polls</a>
</div>

<style>
.poll-results{list-style:none;padding:0}
.poll-results li{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--mu-muted-border-color)}
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const ctx = document.getElementById("results-chart");
    if (!ctx) return;
    const primary = getComputedStyle(document.documentElement).getPropertyValue("--mu-primary").trim() || "#1095c1";
    new Chart(ctx, {
        type: "bar",
        data: {
            labels: [{{ range $i, $c := .Question.Choices }}{{ if $i }}, {{ end }}"{{ $c.Text }}"{{ end }}],
            datasets: [{
                label: "Votes",
                data: [{{ range $i, $c := .Question.Choices }}{{ if $i }}, {{ end }}{{ $c.Votes }}{{ end }}],
                backgroundColor: primary,
                borderColor: primary,
                borderWidth: 1,
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            indexAxis: "y",
            scales: {
                x: { beginAtZero: true, ticks: { stepSize: 1 } }
            },
            plugins: {
                legend: { display: false }
            }
        }
    });
});
</script>
{{- end }}
